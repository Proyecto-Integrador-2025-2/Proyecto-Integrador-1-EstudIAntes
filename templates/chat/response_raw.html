{% extends "base.html" %}
{% block title %}Respuesta IA · EstudIAntes{% endblock %}
{% block content %}
<div class="card max-w-xl mx-auto">
  <h1 class="mb-3">Respuesta de la IA</h1>
  <p class="muted mb-3">La IA no devolvió un formato estructurado, pero aquí puedes leer su respuesta completa:</p>
  <div class="card whitespace-pre-wrap">{{ text }}</div>
  <div class="mt-4 flex gap-3 flex-wrap">
    <a href="{% url 'chat:home' %}" class="btn btn-link">Volver al chat</a>
    <a href="{% url 'chat:list_routine_slots' %}" class="btn btn-link">Ver mi rutina</a>
  </div>
</div>
{% endblock %}
