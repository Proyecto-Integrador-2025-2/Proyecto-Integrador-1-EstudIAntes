<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{% block title %}EstudIAntes{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    :root {
      --bg:#e3f2fd;
      --card:#ffffff;
      --text:#0a1f44;
      --muted:#5c6b7c;
      --accent:#2196f3;
      --border:#b0c4de;
      --shadow:0 4px 12px rgba(0,0,0,.1);
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    body { 
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #0d47a1; }

    .container { max-width:1080px; margin:0 auto; padding:24px; }

    nav.nav {
      display:flex; flex-wrap:wrap; gap:16px; align-items:center;
      padding:16px 0; border-bottom:1px solid var(--border); margin-bottom:24px;
    }
    nav.nav a { font-weight:600; transition: color 0.2s; }
    nav.nav a:hover { color:#0d47a1; }

    .btn {
      display:inline-block; background: var(--accent); color:#fff;
      border:none; padding:10px 18px; border-radius:12px; font-weight:600;
      cursor:pointer; transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #1976d2; transform: translateY(-1px); }
    .btn:disabled { background: #90caf9; cursor: not-allowed; }

    .btn-link { background:transparent; border:none; color: var(--accent); cursor:pointer; padding:0; }
    
    input, textarea, select {
      background: #ffffff;
      border:1px solid var(--border);
      color: var(--text);
      padding:10px 14px;
      border-radius:12px;
      width:100%;
      font-size:1rem;
    }
    input:focus, textarea:focus, select:focus { outline:none; border-color: var(--accent); }

    .card {
      background: var(--card); border:1px solid var(--border); border-radius:16px;
      padding:16px; box-shadow: var(--shadow); transition: transform 0.15s;
    }
    .card:hover { transform: translateY(-2px); }

    .muted { color: var(--muted); font-size:0.95rem; }

    .grid { display:grid; gap:16px; }
    @media(min-width:720px){ .grid-3{grid-template-columns:repeat(3,minmax(0,1fr)); } }

    table { width:100%; border-collapse: collapse; margin-top:16px; }
    th, td { padding:10px 12px; border:1px solid var(--border); }
    th { background: #bbdefb; }
    tr:nth-child(even) { background: #e3f2fd; }

    .pagination { display:flex; gap:8px; justify-content:center; margin:24px 0; }
    .tag { border:1px solid var(--border); padding:6px 10px; border-radius:999px; }

    .prose { line-height:1.7; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="/"><strong>Inicio</strong></a>
      <a href="/horarios/"><strong>Horarios</strong></a>
      <a href="/rutina/"><strong>Rutina</strong></a>
      <a href="/contenido/desafios/"><strong>Desafíos</strong></a>
      <a href="/contenido/historias/"><strong>Historias</strong></a>
      <a href="/chat/"><strong>Chat</strong></a>

      {% if user.is_authenticated %}
        <span style="margin-left:auto;color:var(--muted);">Hola, {{ user.username }}</span>
        <a href="/accounts/logout/" style="color:var(--accent);margin-left:8px;">Salir</a>
      {% else %}
        <a href="/accounts/login/" style="margin-left:auto;">Ingresar</a>
      {% endif %}
    </nav>

    {% if messages %}
      <div>
        {% for message in messages %}
          <div class="card muted mb-2">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
