<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{% block title %}EstudIAntes{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    :root {
      --bg:#0b1020;
      --card:#121935;
      --text:#e7eaf6;
      --muted:#aab2d5;
      --accent:#6ea8fe;
      --border:#223055;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;
    }
    a{color:var(--accent);text-decoration:none}
    .container{max-width:1080px;margin:0 auto;padding:24px}
    .nav{
      display:flex;
      flex-wrap:wrap;
      gap:20px;
      align-items:center;
      padding:16px 0;
      border-bottom:1px solid var(--border);
      margin-bottom:24px;
    }
    .nav a{
      font-weight:600;
      transition:color .2s ease;
    }
    .nav a:hover{color:#fff;}
    .input{
      background:#0f1530;
      border:1px solid var(--border);
      color:var(--text);
      padding:10px 12px;
      border-radius:10px;
    }
    .btn{
      background:var(--accent);
      color:#0a0a0a;
      border:0;
      padding:10px 14px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
    }
    .btn-link{
      background:transparent;
      border:0;
      color:var(--accent);
      cursor:pointer;
      padding:0;
    }
    .grid{display:grid;gap:16px}
    .grid-3{grid-template-columns:repeat(1,minmax(0,1fr))}
    @media(min-width:720px){
      .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
      box-shadow:0 4px 18px rgba(0,0,0,.25);
    }
    .card h3{margin:0 0 8px}
    .muted{color:var(--muted);font-size:.95rem}
    .pagination{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:center;
      margin:24px 0;
    }
    .tagbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:10px 0 16px;
    }
    .tag{
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
    }
    .prose{line-height:1.7}
    header h1{margin:0}
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="/"><strong>Inicio</strong></a>
      <a href="/horarios/"><strong>Horarios</strong></a>
      <a href="/rutina/"><strong>Rutina</strong></a>
      <a href="/contenido/desafios/"><strong>Desafíos</strong></a>
      <a href="/contenido/historias/"><strong>Historias</strong></a>
      <a href="/chat/"><strong>Chat</strong></a>

      {% if user.is_authenticated %}
        <span style="margin-left:auto;color:var(--muted);">Hola, {{ user.username }}</span>
        <a href="/accounts/logout/" style="color:var(--accent);margin-left:8px;">Salir</a>
      {% else %}
        <a href="/accounts/login/" style="margin-left:auto;">Ingresar</a>
      {% endif %}
    </nav>

    {% if messages %}
      <div>
        {% for message in messages %}
          <div style="background:var(--card);border:1px solid var(--border);padding:8px 12px;border-radius:8px;margin-bottom:8px;">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
