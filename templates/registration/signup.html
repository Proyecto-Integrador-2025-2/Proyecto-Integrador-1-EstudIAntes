{% extends "base.html" %}
{% block content %}
<div class="card max-w-sm mx-auto p-6">
  <h3 class="mb-3">Crear cuenta</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn w-full mt-2" type="submit">Registrarme</button>
  </form>
  <p class="mt-3">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
</div>
{% endblock %}
