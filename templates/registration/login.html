{% extends "base.html" %}
{% block content %}
<div class="card max-w-sm mx-auto p-6">
  <h3 class="mb-3">Iniciar sesión</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn w-full mt-2" type="submit">Entrar</button>
  </form>
  <p class="mt-3">¿No tienes cuenta? <a href="{% url 'accounts:signup' %}">Regístrate</a></p>
</div>
{% endblock %}
